[project]
name = "fastapi-app-example"
version = "0.1.0"
description = "A production-ready FastAPI application template"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "types-psutil>=7.2.2",
    "pip-audit>=2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
